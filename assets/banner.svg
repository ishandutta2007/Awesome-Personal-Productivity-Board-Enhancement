<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="340" style="border-radius: 12px; overflow: hidden; background: #0d1117;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1e38" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="card-grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="card-grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0.7" />
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .grid-line { stroke: #334155; stroke-opacity: 0.18; stroke-width: 1; }
    
    /* Background subtle floating kanban cards (behind text) */
    .kanban-column {
      rx: 8px;
      fill: #1e293b;
      fill-opacity: 0.35;
      stroke: #475569;
      stroke-opacity: 0.3;
      stroke-width: 1.5;
    }

    .float-card-1 {
      animation: float1 7s ease-in-out infinite;
    }
    .float-card-2 {
      animation: float2 9s ease-in-out infinite;
    }
    .float-card-3 {
      animation: float3 6s ease-in-out infinite;
    }
    .pulse-dot {
      animation: pulse 2.5s ease-in-out infinite;
    }
    .flow-line {
      stroke-dasharray: 6 6;
      animation: dash 20s linear infinite;
    }

    @keyframes float1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    @keyframes float2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(12px); }
    }
    @keyframes float3 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.15); }
    }
    @keyframes dash {
      to { stroke-dashoffset: -200; }
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="340" fill="url(#bg-grad)" />

  <!-- Subtle Animated Grid Pattern in Background -->
  <g class="grid-line">
    <line x1="0" y1="40" x2="1200" y2="40" />
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="220" x2="1200" y2="220" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="150" y1="0" x2="150" y2="340" />
    <line x1="350" y1="0" x2="350" y2="340" />
    <line x1="600" y1="0" x2="600" y2="340" />
    <line x1="850" y1="0" x2="850" y2="340" />
    <line x1="1050" y1="0" x2="1050" y2="340" />
  </g>

  <!-- Flowing Dynamic Connection Lines (Layer 1 - Background) -->
  <path class="flow-line" d="M 50 290 Q 300 240 600 300 T 1150 250" fill="none" stroke="#6366f1" stroke-width="2" stroke-opacity="0.4" />
  <path class="flow-line" d="M 100 60 Q 400 120 700 40 T 1100 80" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Decorative Semi-transparent Kanban Board Columns in Background Left & Right -->
  <!-- Left Side Kanban Column (Background element) -->
  <g opacity="0.4" class="float-card-1">
    <rect x="40" y="65" width="130" height="210" class="kanban-column" />
    <rect x="50" y="80" width="110" height="38" rx="6" fill="#334155" />
    <rect x="58" y="90" width="60" height="6" rx="3" fill="#38bdf8" />
    <rect x="58" y="102" width="40" height="5" rx="2" fill="#94a3b8" />

    <rect x="50" y="128" width="110" height="48" rx="6" fill="#334155" />
    <rect x="58" y="138" width="80" height="6" rx="3" fill="#818cf8" />
    <rect x="58" y="150" width="55" height="5" rx="2" fill="#94a3b8" />
    <rect x="58" y="160" width="35" height="5" rx="2" fill="#64748b" />
    
    <rect x="50" y="186" width="110" height="36" rx="6" fill="#334155" />
    <rect x="58" y="196" width="70" height="6" rx="3" fill="#34d399" />
  </g>

  <!-- Right Side Floating Cards (Background elements) -->
  <g opacity="0.45" class="float-card-2">
    <rect x="1020" y="55" width="140" height="225" class="kanban-column" />
    <!-- Mini progress card -->
    <rect x="1032" y="70" width="116" height="55" rx="6" fill="#334155" />
    <circle cx="1046" cy="84" r="5" fill="#10b981" />
    <rect x="1058" y="81" width="70" height="6" rx="3" fill="#f1f5f9" />
    <rect x="1044" y="102" width="92" height="6" rx="3" fill="#1e293b" />
    <rect x="1044" y="102" width="68" height="6" rx="3" fill="#3b82f6" />

    <rect x="1032" y="135" width="116" height="44" rx="6" fill="#334155" />
    <rect x="1044" y="146" width="60" height="6" rx="3" fill="#c084fc" />
    <rect x="1044" y="158" width="45" height="5" rx="2" fill="#94a3b8" />

    <rect x="1032" y="190" width="116" height="42" rx="6" fill="#334155" />
    <rect x="1044" y="201" width="75" height="6" rx="3" fill="#fbbf24" />
    <rect x="1044" y="213" width="50" height="5" rx="2" fill="#94a3b8" />
  </g>

  <!-- Flowing Glowing Orbs in background -->
  <circle cx="300" cy="80" r="45" fill="#6366f1" opacity="0.12" filter="url(#glow)" class="pulse-dot" />
  <circle cx="900" cy="260" r="55" fill="#06b6d4" opacity="0.12" filter="url(#glow)" class="pulse-dot" />

  <!-- FOREGROUND: Titles and Badges (Unobstructed, High Contrast) -->
  <g transform="translate(600, 0)" text-anchor="middle">
    <!-- Top Category Pill Tag -->
    <g transform="translate(0, 52)">
      <rect x="-145" y="-14" width="290" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6" />
      <circle cx="-124" cy="0" r="4" fill="#38bdf8" class="pulse-dot" />
      <text x="-110" y="4" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="start">CURATED ECOSYSTEM • 2026</text>
    </g>

    <!-- Main Title -->
    <text y="128" fill="url(#text-grad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.5" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.8))">Awesome Personal Productivity</text>
    
    <text y="172" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="-0.2" filter="drop-shadow(0 2px 8px rgba(0,0,0,0.8))">&amp; Board Enhancement</text>

    <!-- Subtitle -->
    <text y="218" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400">Top SaaS Platforms, Kanban Boards &amp; Self-Hosted Local-First Personal OS</text>

    <!-- Interactive Feature Pills in Foreground -->
    <g transform="translate(0, 268)">
      <!-- Pill 1 -->
      <g transform="translate(-230, 0)">
        <rect x="-70" y="-16" width="140" height="32" rx="16" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="0" y="5" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600">📋 Kanban Boards</text>
      </g>

      <!-- Pill 2 -->
      <g transform="translate(-75, 0)">
        <rect x="-70" y="-16" width="140" height="32" rx="16" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="0" y="5" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600">⚡ GTD &amp; Tasks</text>
      </g>

      <!-- Pill 3 -->
      <g transform="translate(80, 0)">
        <rect x="-70" y="-16" width="140" height="32" rx="16" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="0" y="5" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600">🔒 Local-First OS</text>
      </g>

      <!-- Pill 4 -->
      <g transform="translate(235, 0)">
        <rect x="-70" y="-16" width="140" height="32" rx="16" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="0" y="5" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600">🌟 Self-Hosted</text>
      </g>
    </g>
  </g>
</svg>
